name = "yueyue-frontend"
main = ".open-next/worker.js"
compatibility_date = "2026-11-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_API_ORIGIN = "https://yueyuezidaidaixue.ccwu.cc"
NEXT_PUBLIC_PV_BASE = "https://yueyuezidaidaixue.ccwu.cc/pv"

[observability]
enabled = true
